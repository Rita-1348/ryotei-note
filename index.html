<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="旅程ノート" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>旅程ノート</title>
    <style>
      body { margin: 0; background: #f8f7f4; }
      @media (prefers-color-scheme: dark) { body { background: #151a20; } }
    </style>
    <script>
      // 画面が出なかったとき(古いキャッシュ・読み込み失敗・古い端末)に、真っ白のままにせず自動で1回やり直し、
      // それでも駄目なら原因と復旧ボタンを表示する。旅行データ(localStorage)には触れない。
      (function () {
        var FLAG = 'ryotei-note:retried';
        function mounted() {
          var r = document.getElementById('root');
          return !!(r && r.childNodes.length > 0);
        }
        function reloadFresh() {
          location.replace(location.pathname + '?v=' + Date.now() + location.hash);
        }
        function clearAndReload() {
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(jobs).then(reloadFresh, reloadFresh);
        }
        function show(detail) {
          if (mounted() || document.getElementById('boot-error')) return;
          var box = document.createElement('div');
          box.id = 'boot-error';
          box.style.cssText = 'font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;padding:24px 20px;color:#18212b;max-width:560px;margin:0 auto';
          var h = document.createElement('p');
          h.style.cssText = 'font-size:20px;font-weight:700;margin:0 0 12px';
          h.textContent = '旅程ノートを表示できませんでした';
          var p = document.createElement('p');
          p.style.cssText = 'margin:0 0 16px';
          p.textContent = '保存済みの旅行データは消えていません。下のボタンで読み込み直してください。';
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = '古いデータを消して読み込み直す';
          b.style.cssText = 'min-height:48px;padding:0 20px;font:600 17px sans-serif;color:#fff;background:#244a77;border:0;border-radius:10px';
          b.onclick = clearAndReload;
          var d = document.createElement('p');
          d.style.cssText = 'margin:16px 0 0;font-size:13px;color:#485460;word-break:break-all';
          d.textContent = '詳細: ' + (detail || '不明') + ' / ' + navigator.userAgent;
          box.appendChild(h); box.appendChild(p); box.appendChild(b); box.appendChild(d);
          document.body.appendChild(box);
        }
        function fail(detail) {
          if (mounted()) return;
          try {
            if (!sessionStorage.getItem(FLAG)) {
              sessionStorage.setItem(FLAG, '1');
              reloadFresh();
              return;
            }
          } catch (e) { /* sessionStorage が使えなくても表示は出す */ }
          show(detail);
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          fail((e && e.message) || (t && (t.src || t.href)) || 'error');
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          fail('unhandledrejection: ' + (e && e.reason && (e.reason.message || e.reason)));
        });
        setTimeout(function () { fail('起動がタイムアウトしました'); }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
